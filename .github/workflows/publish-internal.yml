name: Publish Internal Packages

on:
  workflow_dispatch:
    inputs:
      package_scope:
        description: Optional Melos package name to publish.
        required: false
        default: ""
      dry_run:
        description: Validate without publishing.
        type: boolean
        default: true

permissions:
  contents: read

env:
  PUB_REGISTRY_URL: https://registry.hippolabs.org/pub/internal-pub/

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0
      - name: Authenticate private package sources
        env:
          HIPPOLABS_REPO_TOKEN: ${{ secrets.HIPPOLABS_REPO_TOKEN }}
        run: |
          test -n "$HIPPOLABS_REPO_TOKEN"
          git config --global url."https://x-access-token:${HIPPOLABS_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: dart pub get
      - run: dart run melos run ci
      - name: Configure internal Pub token
        env:
          PUB_TOKEN: ${{ secrets.INTERNAL_PUB_TOKEN }}
        run: dart pub token add "$PUB_REGISTRY_URL" --env-var PUB_TOKEN
      - name: Publish
        env:
          PACKAGE_SCOPE: ${{ inputs.package_scope }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--no-private --yes)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); else args+=(--no-dry-run); fi
          if [[ -n "$PACKAGE_SCOPE" ]]; then args+=(--scope "$PACKAGE_SCOPE"); fi
          dart run melos publish "${args[@]}"
