name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DART_VERSION: 3.13.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Get dependencies
        run: dart pub get

      - name: Run checks
        run: dart run melos run ci
