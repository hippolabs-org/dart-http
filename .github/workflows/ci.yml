name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DART_VERSION: 3.13.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Get dependencies
        run: dart pub get

      - name: Run checks
        run: dart run melos run ci

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: >-
          cargo fmt --check
          --manifest-path packages/dart_http_server_runtime/rust/Cargo.toml
      - run: >-
          cargo clippy
          --manifest-path packages/dart_http_server_runtime/rust/Cargo.toml
          --all-targets -- -D warnings
      - run: >-
          cargo test
          --manifest-path packages/dart_http_server_runtime/rust/Cargo.toml
