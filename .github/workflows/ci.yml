name: CI

# GitHub Actions minutes are limited. Run this workflow manually and use it carefully.
on:
  workflow_dispatch:

env:
  DART_VERSION: 3.13.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Get dependencies
        run: dart pub get

      - name: Run checks
        run: dart run melos run ci

  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - dart_http_native_client
          - dart_http_server_runtime
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: >-
          cargo fmt --check
          --manifest-path packages/${{ matrix.package }}/rust/Cargo.toml
      - run: >-
          cargo clippy
          --manifest-path packages/${{ matrix.package }}/rust/Cargo.toml
          --all-targets -- -D warnings
      - run: >-
          cargo test
          --manifest-path packages/${{ matrix.package }}/rust/Cargo.toml

  native-client-smoke:
    name: Native client smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Get dependencies
        working-directory: packages/dart_http_native_client
        run: dart pub get
      - name: Run native HTTP and WebSocket tests
        working-directory: packages/dart_http_native_client
        run: dart test test/native_http_client_test.dart
