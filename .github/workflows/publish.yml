name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      package_scope:
        description: Optional exact Melos package name to publish.
        required: false
        default: ""
      dry_run:
        description: Validate without publishing or creating native releases.
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    uses: hipposphere/devops/.github/workflows/publish-dart-packages.yml@05bda10e477705a1e1520a8a86c415a0b3822d29
    with:
      package_scope: ${{ inputs.package_scope }}
      dry_run: ${{ inputs.dry_run }}
      dart_version: "3.13.0"
      devops_ref: 05bda10e477705a1e1520a8a86c415a0b3822d29
    secrets:
      pub_credentials: ${{ secrets.PUB_CREDENTIALS }}
