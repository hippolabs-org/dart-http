name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      package_scope:
        description: Optional exact Melos package name to publish.
        required: false
        default: ""
      dry_run:
        description: Validate without publishing or creating native releases.
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    uses: hipposphere/devops/.github/workflows/publish-dart-packages.yml@156f2076137c51b20a3e9aa5836b03146e7438c0
    with:
      package_scope: ${{ inputs.package_scope }}
      dry_run: ${{ inputs.dry_run }}
      dart_version: "3.13.0"
      devops_ref: 156f2076137c51b20a3e9aa5836b03146e7438c0
    secrets:
      pub_credentials: ${{ secrets.PUB_CREDENTIALS }}
      native_artifacts_token: ${{ secrets.NATIVE_ARTIFACTS_TOKEN }}
