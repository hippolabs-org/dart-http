name: Publish Packages

# GitHub Actions minutes are limited. Run this workflow manually and use it carefully.
on:
  workflow_dispatch:
    inputs:
      package_scope:
        description: Optional exact Melos package name to publish.
        required: false
        default: ""
      dry_run:
        description: Validate without publishing or creating native releases.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    uses: hipposphere/devops/.github/workflows/publish-dart-packages.yml@24878db00be911c1847f7470de9bf4726d08b610
    with:
      package_scope: ${{ inputs.package_scope }}
      dry_run: ${{ inputs.dry_run }}
      dart_version: "3.13.0"
      devops_ref: 24878db00be911c1847f7470de9bf4726d08b610
    secrets:
      pub_credentials: ${{ secrets.PUB_CREDENTIALS }}
      native_artifacts_token: ${{ secrets.NATIVE_ARTIFACTS_TOKEN }}
