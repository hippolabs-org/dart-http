version: 0.1.0
homepage: https://hippolabs.org
repository: https://github.com/hippolabs-org/dart-http/tree/main/packages/dart_http_web_artifact
publish_to: "https://pub.hippolabs.org"
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  dart_http_core:
    hosted: "https://pub.hippolabs.org"
    version: ^0.3.49
  mime: ^2.0.0
  path: ^1.9.1

dev_dependencies:
  hippo_analysis:
    hosted: https://pub.hippolabs.org
    version: ^0.1.2
  test: ^1.30.0
