name: dart_http_mcp
description: Streamable HTTP adapter for mounting dart_mcp servers on Dart HTTP.
version: 0.1.0-wip.1
homepage: https://hippolabs.org
repository: https://github.com/hippolabs-org/dart-http/tree/main/packages/dart_http_mcp
publish_to: "https://pub.hippolabs.org"
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  dart_http_server:
    hosted: "https://pub.hippolabs.org"
    version: ^0.3.26
  dart_mcp: ^0.6.0-wip

dev_dependencies:
  hippo_analysis:
    hosted: https://pub.hippolabs.org
    version: ^0.1.2
  test: ^1.30.0
