[package]
name = "dart_edge_http_server_core"
version = "0.1.1"
edition = "2024"
description = "Shared native HTTP handler ABI types for Dart Edge HTTP server crates."
publish = false
license = "MIT"
repository = "https://github.com/hippolabs-org/dart-http"
readme = "README.md"
keywords = ["dart-edge", "http", "native-assets"]

[lib]
path = "src/lib.rs"

[dependencies]
dart_edge_core = { path = "../dart_edge_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
