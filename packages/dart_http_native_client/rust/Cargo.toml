[package]
name = "dart_http_native_client"
version = "0.2.23"
edition = "2024"
publish = false

[lib]
name = "dart_http_native_client"
crate-type = ["staticlib", "cdylib"]

[dependencies]
base64 = "0.23"
bytes = "1"
futures-util = "0.3"
native-exchange-abi = "0.2.0"
once_cell = "1.21"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
webpki-roots = "1"

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
