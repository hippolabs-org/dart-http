name: dart_http_native_client
description: Async Rust HTTP transport for Dart HTTP with Native Exchange streaming.
version: 0.2.8
publish_to: "https://pub.hippolabs.org"
repository: https://github.com/hippolabs-org/dart-http/tree/main/packages/dart_http_native_client

environment:
  sdk: ">=3.13.0 <4.0.0"

resolution: workspace

dependencies:
  dart_http_core:
    hosted: "https://pub.hippolabs.org"
    version: ^0.3.53
  ffi: ^2.2.0
  hippolabs_native_assets:
    hosted: "https://pub.hippolabs.org"
    version: ^0.1.2
  hooks: ^2.2.0
  native_exchange:
    hosted: "https://pub.hippolabs.org"
    version: ^0.3.1
  native_exchange_runtime:
    hosted: "https://pub.hippolabs.org"
    version: ^0.2.0

dev_dependencies:
  ffigen: ^20.1.1
  test: ^1.30.0
