name: dart_http_client
description: HTTP and WebSocket transports for generated Dart HTTP clients.
version: 0.3.0
publish_to: "https://pub.hippolabs.org"
repository: https://github.com/hippolabs-org/dart-http/tree/main/packages/dart_http_client

environment:
  sdk: ">=3.13.0 <4.0.0"

resolution: workspace

dependencies:
  dart_http_core:
    hosted: "https://pub.hippolabs.org"
    version: ^0.4.0
  http: ^1.6.0
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  stream_channel: ^2.1.4
  test: ^1.30.0
