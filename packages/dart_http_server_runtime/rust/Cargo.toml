[package]
name = "dart_http_server_runtime"
version = "0.1.25"
edition = "2024"
publish = false

[lib]
name = "dart_http_server_runtime"
crate-type = ["staticlib", "cdylib"]

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", default-features = true, features = ["ws"] }
dart_http_core = { path = "crates/dart_http_core" }
dart_http_server_core = { path = "crates/dart_http_server_core" }
futures-util = "0.3"
http = "1.3"
jsonschema = { version = "0.46", default-features = false }
native-exchange-rust = { version = "0.2.1", features = ["bytes"] }
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
# rcgen 0.14.x fails to compile with time 0.3.48 due to an upstream trait
# coherence conflict. Keep wtransport's transitive time dependency below it
# until rcgen/time publish a compatible release.
time = ">=0.3.21, <0.3.48"
wtransport = "0.7.1"

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
